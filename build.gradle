plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.144'
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
}

base {
    archivesName = mod_jar_name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {

    version = project.neoforge_version

    mods {
        functionalchemical {
            sourceSet sourceSets.main
        }
    }

    runs {
        client {
            client()
        }

        server {
            server()
        }

        gametestWorld {
            client()
            programArguments.addAll("--username", "Dev", "--quickPlaySingleplayer", "GametestWorld")
        }

        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        gametest {
            type = "gameTestServer"
            gameDirectory = project.file("build/gametest")
        }

    }

}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        url = "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        url = "https://maven.blamejared.com/"
    }
    maven {
        name = "Modmaven"
        url = "https://modmaven.dev/"
    }
}

apply from: 'gradle/viking602-dependencies.gradle'
dependencies {
    implementation viking602PinnedFiles
    implementation files('../Mekanism/build/libs/Mekanism-26.1.2-10.8.0-viking602.1.homebaked.jar')
}
java.withSourcesJar()
tasks.named('jar') { from('LICENSE') { into 'META-INF/licenses/functionalchemical' } }


tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version   : minecraft_version, minecraft_version_range: minecraft_version_range,
            neo_version         : neoforge_version, neo_version_range: neoforge_version_range,
            loader_version_range: loader_version_range,
            mod_id              : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors         : mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }

    exclude(".cache/**")
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

sourceSets {
    verification {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
neoForge {
    addModdingDependenciesTo(sourceSets.verification)
    mods { functionalchemical_verification { sourceSet sourceSets.verification } }
    runs {
        verifyServer {
            server()
            sourceSet = sourceSets.verification
            gameDirectory = file('../test-functionalchemical-server-20261011')
            programArguments.add('--nogui')
            systemProperty('functionalchemical.verify', 'true')
        }
        verifyClient {
            client()
            sourceSet = sourceSets.verification
            gameDirectory = file('../test-functionalchemical-client-20261011')
            systemProperty('functionalchemical.verify.client', 'true')
        }
    }
}
